name: Feature request
description: Suggest a focused improvement to AgentCV
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome rather than only the implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches have you tried?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Editor
        - Templates
        - Import
        - Export
        - Dashboard
        - Accessibility
        - Developer experience
        - Other
    validations:
      required: true
